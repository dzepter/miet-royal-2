name: mietroyal-infra

services:
  postgres:
    image: postgres:18-alpine
    container_name: mietroyal-postgres
    environment:
      POSTGRES_USER: mietroyal
      POSTGRES_PASSWORD: mietroyal_local_dev
      POSTGRES_DB: mietroyal_dev
    ports:
      # Nur Loopback: die lokale Dev-Datenbank (mit committetem lokalen
      # Passwort) darf nicht aus dem Netzwerk erreichbar sein.
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mietroyal -d mietroyal_dev']
      interval: 2s
      timeout: 3s
      retries: 20

  # Reine Dev-/Test-Infrastruktur (Phase-3-Vorgabe Nr. 36): S3-kompatibler
  # privater Storage für den S3StorageProvider-Integrationstest. In
  # Production kommt ein echter S3-kompatibler Dienst mit eigenen Secrets.
  minio:
    image: minio/minio:latest
    container_name: mietroyal-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: mietroyal-local
      MINIO_ROOT_PASSWORD: mietroyal_local_dev_storage
    ports:
      # Nur Loopback (lokale Dev-Credentials).
      - '127.0.0.1:59000:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
