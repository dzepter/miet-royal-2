name: mietroyal-infra

services:
  postgres:
    image: postgres:18-alpine
    container_name: mietroyal-postgres
    environment:
      POSTGRES_USER: mietroyal
      POSTGRES_PASSWORD: mietroyal_local_dev
      POSTGRES_DB: mietroyal_dev
    ports:
      # Nur Loopback: die lokale Dev-Datenbank (mit committetem lokalen
      # Passwort) darf nicht aus dem Netzwerk erreichbar sein.
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mietroyal -d mietroyal_dev']
      interval: 2s
      timeout: 3s
      retries: 20

  # Reine Dev-/Test-Infrastruktur (Phase-3-Vorgabe Nr. 36): S3-kompatibler
  # privater Storage für den S3StorageProvider-Integrationstest. In
  # Production kommt ein echter S3-kompatibler Dienst mit eigenen Secrets.
  # Phase 19: RustFS (Apache-2.0, S3-API-kompatibel) ersetzt `minio/minio` –
  # das MinIO-Image ist auf Docker Hub/quay.io nicht mehr anonym abrufbar
  # (docs/TECH_DECISIONS.md „Phase 19“). Port und Zugangsdaten unverändert.
  s3:
    image: rustfs/rustfs:1.0.6
    container_name: mietroyal-s3
    environment:
      RUSTFS_ACCESS_KEY: mietroyal-local
      RUSTFS_SECRET_KEY: mietroyal_local_dev_storage
    ports:
      # Nur Loopback (lokale Dev-Credentials).
      - '127.0.0.1:59000:9000'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/health >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  s3-data:
